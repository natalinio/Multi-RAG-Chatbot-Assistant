# Repository settings for GitHub
# This file can be used with the Probot Settings app or as documentation for manual configuration

repository:
  # Repository visibility - set to true for public repository
  # Note: This setting should be configured manually in GitHub repository settings
  private: false
  
  # Default branch
  default_branch: main
  
  # Allow forking
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  
  # Allow forking
  allow_forking: true
  
  # Allow squash merge
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  
  # Automatically delete head branches after merge
  delete_branch_on_merge: true

# Branch protection rules for main branch
branches:
  - name: main
    # Require pull request reviews before merging
    protection:
      required_pull_request_reviews:
        # Require at least 1 approving review
        required_approving_review_count: 1
        # Dismiss stale pull request approvals when new commits are pushed
        dismiss_stale_reviews: true
        # Require review from Code Owners
        require_code_owner_reviews: false
        # Restrict who can dismiss pull request reviews
        dismissal_restrictions:
          users: []
          teams: []
      
      # Require status checks to pass before merging
      required_status_checks:
        # Require branches to be up to date before merging
        strict: true
        # Status checks that must pass (configure based on your CI/CD)
        contexts: []
      
      # Enforce restrictions for who can push to matching branches
      restrictions:
        # Only specific users/teams can push to this branch
        # Empty means only maintainers can push directly
        users: []
        teams: []
        apps: []
      
      # Require signed commits
      required_signatures: false
      
      # Require linear history
      required_linear_history: false
      
      # Allow force pushes - set to false to prevent force pushes
      allow_force_pushes: false
      
      # Allow deletions - set to false to prevent branch deletion
      allow_deletions: false
      
      # Require conversation resolution before merging
      required_conversation_resolution: true
      
      # Lock branch (read-only)
      lock_branch: false
      
      # Allow fork syncing
      allow_fork_syncing: true
